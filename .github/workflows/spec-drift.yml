name: Spec drift

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compares the SDK endpoints' request/response schemas with testdata/openapi.json and
      # fails on any difference. It never rewrites the snapshot; update that by hand.
      - name: Compare live OpenAPI with the snapshot
        run: npm run spec-drift
